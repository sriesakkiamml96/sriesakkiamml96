<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#03040A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="10" y="10" width="420" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .title { animation: flicker 2.4s infinite; }
    .border { animation: pulse 3s ease-in-out infinite, jitter 2.4s infinite; }
    .scanline { animation: sweep 4s linear infinite; }
    .scanBand { animation: band 2.4s infinite; }
    .tile { animation: tileGlow 3s ease-in-out infinite; }
    .tile2 { animation-delay: 0.75s; }
    .tile3 { animation-delay: 1.5s; }
    .tile4 { animation-delay: 2.25s; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: fill 2.4s ease-out infinite alternate; }
    .dot { animation: blink 1.4s steps(2) infinite; }
    .num { animation: numPulse 3s ease-in-out infinite; }
    .gR { animation: gR 2.4s steps(1) infinite; }
    .gC { animation: gC 2.4s steps(1) infinite; }
    .sA { animation: sA 2.4s steps(1) infinite; }
    .sB { animation: sB 2.4s steps(1) infinite; }
    .sC { animation: sC 2.4s steps(1) infinite; }

    @keyframes flicker { 0%,100% { opacity: 1; } 60% { opacity: 1; } 62% { opacity: 0.4; } 63% { opacity: 1; } 70% { opacity: 0.6; } 71% { opacity: 1; } }
    @keyframes pulse { 0%,100% { stroke-opacity: 0.25; } 50% { stroke-opacity: 0.5; } }
    @keyframes jitter {
      0%,88%,100% { transform: translate(0,0); }
      89% { transform: translate(-3px,1px); }
      90% { transform: translate(4px,-1px); }
      91% { transform: translate(-1px,0); }
      92% { transform: translate(0,0); }
    }
    @keyframes sweep { 0% { transform: translateY(-360px); } 100% { transform: translateY(360px); } }
    @keyframes band {
      0%,80%,100% { opacity: 0; }
      82% { opacity: 0.5; }
      84% { opacity: 0; }
      86% { opacity: 0.35; }
      88% { opacity: 0; }
    }
    @keyframes tileGlow { 0%,100% { stroke-opacity: 0.15; } 50% { stroke-opacity: 0.4; } }
    @keyframes fill { 0% { transform: scaleX(0.2); } 100% { transform: scaleX(1); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes numPulse { 0%,100% { opacity: 0.92; } 50% { opacity: 1; } }
    @keyframes gR {
      0%,82%,100% { transform: translate(0,0); opacity: 0; }
      83% { transform: translate(-5px,0); opacity: 0.8; }
      85% { transform: translate(4px,0); opacity: 0.8; }
      87% { transform: translate(-2px,0); opacity: 0.6; }
      89% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes gC {
      0%,82%,100% { transform: translate(0,0); opacity: 0; }
      83% { transform: translate(5px,0); opacity: 0.7; }
      85% { transform: translate(-4px,0); opacity: 0.7; }
      87% { transform: translate(2px,0); opacity: 0.5; }
      89% { transform: translate(0,0); opacity: 0; }
    }
    @keyframes sA {
      0%,78%,100% { transform: translate(0,0); }
      79% { transform: translate(8px,0); }
      81% { transform: translate(-6px,0); }
      83% { transform: translate(0,0); }
    }
    @keyframes sB {
      0%,84%,100% { transform: translate(0,0); }
      85% { transform: translate(-7px,0); }
      87% { transform: translate(5px,0); }
      89% { transform: translate(0,0); }
    }
    @keyframes sC {
      0%,91%,100% { transform: translate(0,0); }
      92% { transform: translate(6px,0); }
      94% { transform: translate(-4px,0); }
      96% { transform: translate(0,0); }
    }
  </style>

  <!-- Frame -->
  <rect x="10" y="10" width="420" height="340" rx="22" fill="url(#bg)"/>
  <rect class="border" x="10" y="10" width="420" height="340" rx="22" fill="none" stroke="url(#neon)" stroke-width="1.5" filter="url(#glow)"/>

  <g clip-path="url(#frame)">
    <rect class="scanline" x="10" y="0" width="420" height="60" fill="url(#scan)"/>
    <rect class="scanBand" x="10" y="130" width="420" height="10" fill="#00E5FF" opacity="0"/>
    <rect class="scanBand" x="10" y="250" width="420" height="6" fill="#FF2D6F" opacity="0" style="animation-delay:0.3s"/>
  </g>

  <!-- Header: blocky title with Minecraft-style dark shadow -->
  <g class="sA" font-family="'Courier New', Consolas, monospace" font-size="24" font-weight="900" letter-spacing="3">
    <text class="gR" x="36" y="54" fill="#FF2D6F">GITHUB STATS</text>
    <text class="gC" x="36" y="54" fill="#00E5FF">GITHUB STATS</text>
    <text x="36" y="56" fill="#1B1B1B">GITHUB STATS</text>
    <text class="title" x="34" y="52" fill="#FFFFFF" filter="url(#glow)">GITHUB STATS</text>
  </g>
  <text x="34" y="76" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="bold" fill="#7FE7FF" letter-spacing="1">PLAYER: Sri Esakkiammal </text>
  <circle class="dot" cx="400" cy="46" r="5" fill="#00E5FF" filter="url(#glow)"/>
  <text x="380" y="70" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="bold" fill="#A78BFA" text-anchor="end">ONLINE</text>

  <!-- Stat tiles -->
  <g fill="#0E1426" stroke="#00E5FF" stroke-width="1.2" filter="url(#softGlow)">
    <rect class="tile" x="30" y="94" width="176" height="92" rx="14"/>
    <rect class="tile tile2" x="234" y="94" width="176" height="92" rx="14" stroke="#A78BFA"/>
    <rect class="tile tile3" x="30" y="200" width="176" height="92" rx="14" stroke="#A78BFA"/>
    <rect class="tile tile4" x="234" y="200" width="176" height="92" rx="14"/>
  </g>

  <g class="sB" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="bold" fill="#7FE7FF" letter-spacing="2">
    <text x="50" y="118">COMMITS</text>
    <text x="254" y="118">PULL REQS</text>
    <text x="50" y="224">ISSUES</text>
    <text x="254" y="224">REPOS</text>
  </g>

  <!-- Numbers: blocky with dark shadow -->
  <g class="sC">
    <g class="num" font-family="'Courier New', Consolas, monospace" font-size="32" font-weight="900" filter="url(#glow)">
      <text x="52" y="162" fill="#1B1B1B">8</text>
      <text x="256" y="162" fill="#1B1B1B">18</text>
      <text x="52" y="268" fill="#1B1B1B">1</text>
      <text x="256" y="268" fill="#1B1B1B">7</text>
      <text x="50" y="160" fill="#FFFFFF">8</text>
      <text x="254" y="160" fill="#FFFFFF">18</text>
      <text x="50" y="266" fill="#FFFFFF">1</text>
      <text x="254" y="266" fill="#FFFFFF">7</text>
    </g>
  </g>

  <!-- XP bars -->
  <g>
    <rect x="50" y="170" width="136" height="6" rx="3" fill="#1A2238"/>
    <rect class="bar" x="50" y="170" width="136" height="6" rx="3" fill="url(#neon)"/>
    <rect x="254" y="170" width="136" height="6" rx="3" fill="#1A2238"/>
    <rect class="bar" x="254" y="170" width="136" height="6" rx="3" fill="url(#neon)" style="animation-delay:0.5s"/>
    <rect x="50" y="276" width="136" height="6" rx="3" fill="#1A2238"/>
    <rect class="bar" x="50" y="276" width="136" height="6" rx="3" fill="url(#neon)" style="animation-delay:1s"/>
    <rect x="254" y="276" width="136" height="6" rx="3" fill="#1A2238"/>
    <rect class="bar" x="254" y="276" width="136" height="6" rx="3" fill="url(#neon)" style="animation-delay:1.5s"/>
  </g>

  <!-- Footer -->
  <line x1="30" y1="312" x2="410" y2="312" stroke="#00E5FF" stroke-opacity="0.2"/>
  <g font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="bold" fill="#A78BFA" letter-spacing="1">
    <text x="30" y="332">FOLLOWERS 8</text>
    <text x="180" y="332">FOLLOWING 15</text>
    <text x="410" y="332" text-anchor="end" fill="#7FE7FF">LOC: INDIA</text>
  </g>
</svg>
