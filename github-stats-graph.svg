<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="12" fill="#0A0F1F" stroke="#00E5FF" stroke-opacity="0.4"/>

  <text x="20" y="32" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">GitHub Stats</text>

  <!-- Stat boxes -->
  <rect x="20"  y="50" width="80" height="60" rx="8" fill="#111B30" stroke="#00B4FF"/>
  <rect x="105" y="50" width="80" height="60" rx="8" fill="#111B30" stroke="#00B4FF"/>
  <rect x="190" y="50" width="80" height="60" rx="8" fill="#111B30" stroke="#00B4FF"/>
  <rect x="275" y="50" width="80" height="60" rx="8" fill="#111B30" stroke="#00B4FF"/>

  <text x="60"  y="82" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">482</text>
  <text x="60"  y="100" fill="#00B4FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Commits</text>

  <text x="145" y="82" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">18</text>
  <text x="145" y="100" fill="#00B4FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Pull Requests</text>

  <text x="230" y="82" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1</text>
  <text x="230" y="100" fill="#00B4FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Issues</text>

  <text x="315" y="82" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">7</text>
  <text x="315" y="100" fill="#00B4FF" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Repos</text>

  <!-- Languages -->
  <text x="20" y="145" fill="#00E5FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Languages</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#FFFFFF">
    <text x="20" y="181">Python</text>
    <rect x="100" y="170" width="280" height="12" rx="6" fill="#13203A"/>
    <rect x="100" y="170" width="243" height="12" rx="6" fill="url(#g)"/>
    <text x="390" y="181" text-anchor="end" font-size="11">60.66%</text>

    <text x="20" y="207">HTML</text>
    <rect x="100" y="196" width="280" height="12" rx="6" fill="#13203A"/>
    <rect x="100" y="196" width="77" height="12" rx="6" fill="url(#g)"/>
    <text x="390" y="207" text-anchor="end" font-size="11">19.19%</text>

    <text x="20" y="233">CSS</text>
    <rect x="100" y="222" width="280" height="12" rx="6" fill="#13203A"/>
    <rect x="100" y="222" width="72" height="12" rx="6" fill="url(#g)"/>
    <text x="390" y="233" text-anchor="end" font-size="11">18.11%</text>

    <text x="20" y="259">SCSS</text>
    <rect x="100" y="248" width="280" height="12" rx="6" fill="#13203A"/>
    <rect x="100" y="248" width="8" height="12" rx="4" fill="url(#g)"/>
    <text x="390" y="259" text-anchor="end" font-size="11">2.02%</text>

    <text x="20" y="285">Shell</text>
    <rect x="100" y="274" width="280" height="12" rx="6" fill="#13203A"/>
    <rect x="100" y="274" width="2" height="12" rx="1" fill="url(#g)"/>
    <text x="390" y="285" text-anchor="end" font-size="11">0.01%</text>
  </g>
</svg>
