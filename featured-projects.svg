<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223B"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A44"/>
      <stop offset="1" stop-color="#1B1240"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .card { animation: lift 4s ease-in-out infinite; }
    .c2 { animation-delay: 0.6s; }
    .c3 { animation-delay: 1.2s; }
    .c4 { animation-delay: 1.8s; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes lift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Card 1: Image Processing with OpenCV -->
  <g class="card" filter="url(#shadow)">
    <rect x="20" y="20" width="200" height="230" rx="18" fill="url(#card)" stroke="#00E5FF" stroke-opacity="0.35"/>
    <rect x="34" y="34" width="172" height="100" rx="12" fill="url(#tile)"/>
    <rect x="34" y="34" width="172" height="50" rx="12" fill="url(#gloss)"/>
    <ellipse cx="120" cy="84" rx="34" ry="20" fill="none" stroke="#7FE7FF" stroke-width="3"/>
    <circle class="ring" cx="120" cy="84" r="9" fill="#00E5FF" filter="url(#glow)"/>
    <text x="38" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Image Processing</text>
    <text x="38" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">with OpenCV</text>
    <rect x="38" y="194" width="120" height="26" rx="13" fill="#0B1A2E" stroke="#00B4FF"/>
    <circle class="dot" cx="54" cy="207" r="5" fill="#00B4FF"/>
    <text x="66" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7FE7FF">Planned</text>
  </g>

  <!-- Card 2: AI Ambulance Priority System -->
  <g class="card c2" filter="url(#shadow)">
    <rect x="245" y="20" width="200" height="230" rx="18" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="259" y="34" width="172" height="100" rx="12" fill="url(#tile)"/>
    <rect x="259" y="34" width="172" height="50" rx="12" fill="url(#gloss)"/>
    <rect x="300" y="76" width="80" height="22" rx="6" fill="#A78BFA"/>
    <rect x="312" y="64" width="46" height="14" rx="4" fill="#A78BFA" opacity="0.7"/>
    <circle class="ring" cx="317" cy="100" r="6" fill="#FFFFFF"/>
    <circle class="ring" cx="362" cy="100" r="6" fill="#FFFFFF"/>
    <text x="263" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI Ambulance</text>
    <text x="263" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Priority System</text>
    <rect x="263" y="194" width="120" height="26" rx="13" fill="#0B1A2E" stroke="#A78BFA"/>
    <circle class="dot" cx="279" cy="207" r="5" fill="#A78BFA"/>
    <text x="291" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#C4B5FD">Planned</text>
  </g>

  <!-- Card 3: Robot Vision Simulation -->
  <g class="card c3" filter="url(#shadow)">
    <rect x="470" y="20" width="200" height="230" rx="18" fill="url(#card)" stroke="#22C55E" stroke-opacity="0.35"/>
    <rect x="484" y="34" width="172" height="100" rx="12" fill="url(#tile)"/>
    <rect x="484" y="34" width="172" height="50" rx="12" fill="url(#gloss)"/>
    <circle cx="540" cy="110" r="8" fill="#22C55E"/>
    <line x1="540" y1="110" x2="572" y2="78" stroke="#7FE7FF" stroke-width="4" stroke-linecap="round"/>
    <circle class="ring" cx="572" cy="78" r="7" fill="#00E5FF" filter="url(#glow)"/>
    <text x="488" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Robot Vision</text>
    <text x="488" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Simulation</text>
    <rect x="488" y="194" width="120" height="26" rx="13" fill="#0B1A2E" stroke="#22C55E"/>
    <circle class="dot" cx="504" cy="207" r="5" fill="#22C55E"/>
    <text x="516" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#86EFAC">Future Goal</text>
  </g>

  <!-- Card 4: Face Detection Demo -->
  <g class="card c4" filter="url(#shadow)">
    <rect x="695" y="20" width="200" height="230" rx="18" fill="url(#card)" stroke="#00E5FF" stroke-opacity="0.35"/>
    <rect x="709" y="34" width="172" height="100" rx="12" fill="url(#tile)"/>
    <rect x="709" y="34" width="172" height="50" rx="12" fill="url(#gloss)"/>
    <rect x="762" y="58" width="66" height="72" rx="12" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="782" cy="88" r="3" fill="#7FE7FF"/>
    <circle cx="810" cy="88" r="3" fill="#7FE7FF"/>
    <path d="M784 110 Q796 118 808 110" fill="none" stroke="#7FE7FF" stroke-width="2" stroke-linecap="round"/>
    <text x="713" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Face Detection</text>
    <text x="713" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Demo</text>
    <rect x="713" y="194" width="120" height="26" rx="13" fill="#0B1A2E" stroke="#00B4FF"/>
    <circle class="dot" cx="729" cy="207" r="5" fill="#00B4FF"/>
    <text x="741" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7FE7FF">Planned</text>
  </g>
</svg>
