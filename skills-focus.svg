
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
  <defs>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" rx="14" fill="#0A0F1F"/>

  <!-- My Skills panel -->
  <rect x="20" y="20" width="430" height="420" rx="14" fill="#060B18" stroke="#00E5FF" stroke-width="2"/>
  <text x="50" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">My <tspan fill="#00E5FF">Skills</tspan></text>
  <line x1="40" y1="82" x2="430" y2="82" stroke="#00E5FF" stroke-opacity="0.4"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- PYTHON 80 -->
    <text x="50" y="125" font-size="17" fill="#FFFFFF">PYTHON</text>
    <rect x="190" y="114" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="114" width="160" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="105" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="125" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">80%</text>

    <!-- OPENCV 75 -->
    <text x="50" y="183" font-size="17" fill="#FFFFFF">OPENCV</text>
    <rect x="190" y="172" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="172" width="150" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="163" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="183" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">75%</text>

    <!-- C++ 60 -->
    <text x="50" y="241" font-size="17" fill="#FFFFFF">C++</text>
    <rect x="190" y="230" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="230" width="120" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="221" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="241" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">60%</text>

    <!-- AI/ML 55 -->
    <text x="50" y="299" font-size="17" fill="#FFFFFF">AI/ML</text>
    <rect x="190" y="288" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="288" width="110" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="279" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="299" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">55%</text>

    <!-- PYTORCH 40 -->
    <text x="50" y="357" font-size="17" fill="#FFFFFF">PYTORCH</text>
    <rect x="190" y="346" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="346" width="80" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="337" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="357" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">40%</text>

    <!-- ROS 2 35 -->
    <text x="50" y="415" font-size="17" fill="#FFFFFF">ROS 2</text>
    <rect x="190" y="404" width="200" height="12" rx="6" fill="#13203A"/>
    <rect x="190" y="404" width="70" height="12" rx="6" fill="url(#bar)"/>
    <rect x="395" y="395" width="60" height="30" rx="15" fill="none" stroke="#00B4FF"/>
    <text x="425" y="415" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">35%</text>
  </g>

  <!-- Current Focus panel -->
  <rect x="470" y="20" width="410" height="420" rx="14" fill="#060B18" stroke="#A855F7" stroke-width="2"/>
  <text x="500" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Current <tspan fill="#A855F7">Focus</tspan></text>
  <line x1="490" y1="82" x2="860" y2="82" stroke="#A855F7" stroke-opacity="0.4"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#FFFFFF">
    <rect x="495" y="108" width="24" height="24" rx="5" fill="#2A1456" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M501 120 L505 124 L513 116" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="127">Image Processing</text>

    <rect x="495" y="168" width="24" height="24" rx="5" fill="#2A1456" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M501 180 L505 184 L513 176" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="187">Computer Vision</text>

    <rect x="495" y="228" width="24" height="24" rx="5" fill="#2A1456" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M501 240 L505 244 L513 236" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="247">Deep Learning with PyTorch</text>

    <rect x="495" y="288" width="24" height="24" rx="5" fill="#2A1456" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M501 300 L505 304 L513 296" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="307">AI Robotics with ROS 2</text>
  </g>
</svg>
