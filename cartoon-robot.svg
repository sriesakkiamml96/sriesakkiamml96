<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260" viewBox="0 0 300 260">
  <defs>
    <linearGradient id="shell" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2A2E38"/>
      <stop offset="0.25" stop-color="#101318"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE7FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3A7F99" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="visor" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FE7FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7FE7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="110" y="56" width="80" height="60" rx="20"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* Roaming loop */
    .roam { animation: roam 16s ease-in-out infinite; }
    @keyframes roam {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(60px, -10px); }
      50% { transform: translate(0px, 0px); }
      75% { transform: translate(-60px, 10px); }
    }

    /* Jump with squash and stretch, every 3s */
    .jump { transform-box: fill-box; transform-origin: center bottom; animation: jump 3s ease-in-out infinite; }
    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      10% { transform: translateY(0) scale(1.08, 0.88); }
      30% { transform: translateY(-40px) scale(0.95, 1.06); }
      50% { transform: translateY(0) scale(1.06, 0.92); }
      56% { transform: translateY(0) scale(1, 1); }
    }

    /* Gentle tilt */
    .tilt { transform-box: fill-box; transform-origin: center; animation: tilt 8s ease-in-out infinite; }
    @keyframes tilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    /* Scanner beam inside the visor */
    .scanner { animation: scanY 3.2s linear infinite; }
    @keyframes scanY { 0% { transform: translateY(-60px); } 100% { transform: translateY(60px); } }

    /* Expressions: six faces, 3s each, 18s loop */
    .face { opacity: 0; animation: show 18s infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: 3s; }
    .f3 { animation-delay: 6s; }
    .f4 { animation-delay: 9s; }
    .f5 { animation-delay: 12s; }
    .f6 { animation-delay: 15s; }
    @keyframes show {
      0% { opacity: 0; }
      1% { opacity: 1; }
      14% { opacity: 1; }
      17% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Flat black background -->
  <rect width="300" height="260" fill="#000000"/>

  <g transform="translate(-37.5, 20) scale(1.25)"><g class="roam">
    <g class="jump">
      <g class="tilt">

        <!-- Ear panels -->
        <rect x="83" y="72" width="12" height="36" rx="6" fill="url(#shell)" stroke="url(#edge)" stroke-width="1.2"/>
        <rect x="205" y="72" width="12" height="36" rx="6" fill="url(#shell)" stroke="url(#edge)" stroke-width="1.2"/>

        <!-- Antenna -->
        <line x1="150" y1="40" x2="150" y2="24" stroke="#7FE7FF" stroke-width="2"/>
        <circle cx="150" cy="22" r="4" fill="#7FE7FF" filter="url(#glow)"/>

        <!-- Head shell -->
        <rect x="95" y="40" width="110" height="92" rx="34" fill="url(#shell)" stroke="url(#edge)" stroke-width="2"/>
        <path d="M112 50 Q150 40 188 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

        <!-- Visor -->
        <rect x="110" y="56" width="80" height="60" rx="20" fill="url(#visor)" stroke="#7FE7FF" stroke-opacity="0.2"/>

        <!-- Scanner beam -->
        <g clip-path="url(#screen)">
          <rect class="scanner" x="110" y="56" width="80" height="20" fill="url(#beam)"/>
        </g>

        <!-- Expressions -->
        <g clip-path="url(#screen)">

          <!-- 1. Happy -->
          <g class="face f1" filter="url(#glow)" fill="none" stroke="#7FE7FF" stroke-width="4" stroke-linecap="round">
            <path d="M125 84 Q132 74 139 84"/>
            <path d="M161 84 Q168 74 175 84"/>
            <path d="M134 98 Q150 110 166 98"/>
          </g>

          <!-- 2. Sad -->
          <g class="face f2" filter="url(#glow)" fill="#7FE7FF">
            <ellipse cx="132" cy="82" rx="5" ry="6"/>
            <ellipse cx="168" cy="82" rx="5" ry="6"/>
            <path d="M122 72 L138 76" stroke="#7FE7FF" stroke-width="3" stroke-linecap="round"/>
            <path d="M178 72 L162 76" stroke="#7FE7FF" stroke-width="3" stroke-linecap="round"/>
            <path d="M136 106 Q150 96 164 106" fill="none" stroke="#7FE7FF" stroke-width="3.5" stroke-linecap="round"/>
          </g>

          <!-- 3. Bored -->
          <g class="face f3" filter="url(#glow)" stroke="#7FE7FF" stroke-width="5" stroke-linecap="round">
            <line x1="124" y1="82" x2="140" y2="82"/>
            <line x1="160" y1="82" x2="176" y2="82"/>
            <line x1="140" y1="100" x2="160" y2="100" stroke-width="3"/>
          </g>

          <!-- 4. Doubtful -->
          <g class="face f4" filter="url(#glow)" fill="#7FE7FF">
            <ellipse cx="132" cy="82" rx="5" ry="6"/>
            <line x1="160" y1="86" x2="176" y2="76" stroke="#7FE7FF" stroke-width="4" stroke-linecap="round"/>
            <path d="M138 102 Q143 97 148 102 Q153 107 158 100" fill="none" stroke="#7FE7FF" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- 5. Love -->
          <g class="face f5" filter="url(#glow)" fill="#FF6B9A">
            <path transform="translate(132,80) scale(1.8)" d="M0 6 C-8 -2 -2 -8 0 -3 C2 -8 8 -2 0 6Z"/>
            <path transform="translate(168,80) scale(1.8)" d="M0 6 C-8 -2 -2 -8 0 -3 C2 -8 8 -2 0 6Z"/>
            <path d="M136 98 Q150 110 164 98" fill="none" stroke="#FF6B9A" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- 6. Angry -->
          <g class="face f6" filter="url(#glow)" stroke="#7FE7FF" stroke-linecap="round">
            <path d="M122 70 L140 80" stroke-width="5"/>
            <path d="M178 70 L160 80" stroke-width="5"/>
            <ellipse cx="132" cy="86" rx="6" ry="4" fill="#7FE7FF" stroke="none"/>
            <ellipse cx="168" cy="86" rx="6" ry="4" fill="#7FE7FF" stroke="none"/>
            <path d="M138 106 Q150 96 162 106" fill="none" stroke-width="4"/>
          </g>
        </g>

      </g>
    </g>
  </g></g>
</svg>
