<svg xmlns="http://www.w3.org/2000/svg" width="300" height="320" viewBox="0 0 300 320">
  <style>
    .bob { animation: bob 2.4s ease-in-out infinite; }
    .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    .wave { animation: wave 1.6s ease-in-out infinite; transform-origin: 0 0; }
    .spark { animation: spark 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
    @keyframes spark { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <rect width="300" height="320" rx="16" fill="#0A0F1F" stroke="#00E5FF" stroke-opacity="0.4"/>

  <!-- Sparkles -->
  <circle class="spark" cx="50" cy="60" r="4" fill="#00E5FF"/>
  <circle class="spark" cx="250" cy="90" r="3" fill="#A855F7" style="animation-delay:0.6s"/>
  <circle class="spark" cx="235" cy="40" r="3" fill="#00E5FF" style="animation-delay:1.2s"/>

  <g class="bob">
    <!-- Antenna -->
    <line x1="150" y1="60" x2="150" y2="36" stroke="#A855F7" stroke-width="4"/>
    <circle cx="150" cy="32" r="7" fill="#00E5FF"/>

    <!-- Head -->
    <rect x="95" y="60" width="110" height="90" rx="22" fill="#E6F7FF" stroke="#00B4FF" stroke-width="3"/>

    <!-- Eyes -->
    <ellipse class="blink" cx="125" cy="100" rx="9" ry="11" fill="#0A0F1F"/>
    <ellipse class="blink" cx="175" cy="100" rx="9" ry="11" fill="#0A0F1F"/>
    <circle cx="128" cy="96" r="3" fill="#FFFFFF"/>
    <circle cx="178" cy="96" r="3" fill="#FFFFFF"/>

    <!-- Smile -->
    <path d="M128 125 Q150 140 172 125" fill="none" stroke="#0A0F1F" stroke-width="4" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="112" cy="122" r="5" fill="#FF8FB1" opacity="0.6"/>
    <circle cx="188" cy="122" r="5" fill="#FF8FB1" opacity="0.6"/>

    <!-- Body -->
    <rect x="110" y="156" width="80" height="80" rx="16" fill="#A855F7" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="150" cy="190" r="10" fill="#00E5FF"/>

    <!-- Left arm (static) -->
    <line x1="110" y1="170" x2="84" y2="200" stroke="#7C3AED" stroke-width="12" stroke-linecap="round"/>

    <!-- Right arm (waving) -->
    <g class="wave">
      <line x1="190" y1="170" x2="222" y2="140" stroke="#7C3AED" stroke-width="12" stroke-linecap="round"/>
      <circle cx="226" cy="134" r="9" fill="#E6F7FF" stroke="#00B4FF" stroke-width="2"/>
    </g>

    <!-- Legs -->
    <rect x="120" y="236" width="18" height="32" rx="6" fill="#00B4FF"/>
    <rect x="162" y="236" width="18" height="32" rx="6" fill="#00B4FF"/>
  </g>
</svg>
