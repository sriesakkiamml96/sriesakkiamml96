<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#FF5CA8" opacity="0.18"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDF3FF"/>
    </linearGradient>
    <clipPath id="frame"><rect x="6" y="6" width="388" height="288" rx="22"/></clipPath>
  </defs>

  <style>
    .speed { animation: speed 1.4s linear infinite; }
    .s2 { animation-delay: 0.5s; }
    .s3 { animation-delay: 0.9s; }
    .title { transform-box: fill-box; transform-origin: center; animation: pop 3.5s ease-in-out infinite; }
    .bubble { transform-box: fill-box; transform-origin: center; animation: bob 3s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
    .k2 { animation-delay: 0.7s; }
    .k3 { animation-delay: 1.4s; }
    .tile { animation: glow 3.6s ease-in-out infinite; }
    .t2 { animation-delay: 0.9s; }
    .t3 { animation-delay: 1.8s; }
    .t4 { animation-delay: 2.7s; }
    @keyframes speed { 0% { transform: translateX(-120px); } 100% { transform: translateX(420px); } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.2; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes glow { 0%,100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; } }
  </style>

  <!-- Panel background -->
  <rect x="6" y="6" width="388" height="288" rx="22" fill="#0B0A1F" stroke="#FF5CA8" stroke-width="3"/>

  <g clip-path="url(#frame)">
    <rect x="6" y="6" width="388" height="288" fill="url(#dots)"/>

    <!-- Anime speed lines -->
    <g stroke="#00E5FF" stroke-linecap="round" fill="none" opacity="0.5">
      <line class="speed" x1="-120" y1="40" x2="-60" y2="40" stroke-width="2"/>
      <line class="speed s2" x1="-120" y1="92" x2="-40" y2="92" stroke-width="1.5"/>
      <line class="speed s3" x1="-120" y1="250" x2="-50" y2="250" stroke-width="2"/>
      <line class="speed s2" x1="-120" y1="270" x2="-70" y2="270" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Title with anime-style outline and offset shadow -->
  <g class="title">
    <text x="206" y="66" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="36" font-weight="900" fill="#FF5CA8" letter-spacing="2">CONNECT</text>
    <text x="202" y="62" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="36" font-weight="900" fill="#0B0A1F" stroke="#0B0A1F" stroke-width="6" stroke-linejoin="round" letter-spacing="2">CONNECT</text>
    <text x="200" y="60" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="36" font-weight="900" fill="url(#title)" letter-spacing="2">CONNECT</text>
  </g>
  <text x="200" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="6">WITH ME</text>

  <!-- Sparkles -->
  <path class="spark" d="M352 40 L355 49 L364 52 L355 55 L352 64 L349 55 L340 52 L349 49 Z" fill="#FFE066"/>
  <path class="spark k2" d="M52 110 L54 116 L60 118 L54 120 L52 126 L50 120 L44 118 L50 116 Z" fill="#00E5FF"/>
  <path class="spark k3" d="M362 128 L364 133 L369 135 L364 137 L362 142 L360 137 L355 135 L360 133 Z" fill="#FF5CA8"/>

  <!-- Speech bubble -->
  <g class="bubble">
    <path d="M44 100 Q44 92 52 92 L348 92 Q356 92 356 100 L356 150 Q356 158 348 158 L226 158 L206 176 L210 158 L52 158 Q44 158 44 150 Z" fill="#FFFFFF"/>
    <text x="200" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0B0A1F">Let’s build something</text>
    <text x="200" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0B0A1F">amazing together! ✦</text>
  </g>

  <!-- Social tiles -->
  <g font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" letter-spacing="1" text-anchor="middle">
    <rect class="tile" x="26" y="206" width="84" height="40" rx="12" fill="#151233" stroke="#00E5FF" stroke-width="2"/>
    <text x="68" y="231" fill="#7FE7FF">GITHUB</text>

    <rect class="tile t2" x="118" y="206" width="84" height="40" rx="12" fill="#151233" stroke="#00B4FF" stroke-width="2"/>
    <text x="160" y="231" fill="#7FE7FF">LINKEDIN</text>

    <rect class="tile t3" x="210" y="206" width="84" height="40" rx="12" fill="#151233" stroke="#FF5CA8" stroke-width="2"/>
    <text x="252" y="231" fill="#FFB3D1">EMAIL</text>

    <rect class="tile t4" x="302" y="206" width="72" height="40" rx="12" fill="#151233" stroke="#A78BFA" stroke-width="2"/>
    <text x="338" y="231" fill="#C4B5FD">X</text>
  </g>

  <text x="200" y="272" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#6B7A99" letter-spacing="2">● ONLINE · OPEN TO COLLAB</text>
</svg>
