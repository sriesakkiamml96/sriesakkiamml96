<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C18"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="700" height="250" rx="14"/></clipPath>
  </defs>

  <style>
    .wipe1 { animation: wipe 6s ease-in-out infinite; }
    .wipe2 { animation: wipe 6s ease-in-out infinite; animation-delay: 1.2s; }
    .wipe3 { animation: wipe 6s ease-in-out infinite; animation-delay: 2.4s; }
    .head { animation: flicker 4s infinite; }
    .scanbar { animation: scanY 3.5s linear infinite; }
    .fadeUp { animation: fadeUp 6s ease-out infinite; }
    .chip { animation: chipPulse 2.4s ease-in-out infinite; }
    .c2 { animation-delay: 0.3s; }
    .c3 { animation-delay: 0.6s; }
    .c4 { animation-delay: 0.9s; }
    .c5 { animation-delay: 1.2s; }
    .c6 { animation-delay: 1.5s; }
    .bar { animation: barGrow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }

    @keyframes wipe {
      0% { transform: translateX(0); opacity: 1; }
      30% { transform: translateX(720px); opacity: 1; }
      31%, 100% { transform: translateX(720px); opacity: 0; }
    }
    @keyframes flicker {
      0%, 88%, 100% { opacity: 1; }
      90% { opacity: 0.6; }
      91% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
    }
    @keyframes scanY {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(260px); }
    }
    @keyframes fadeUp {
      0%, 35% { opacity: 0; transform: translateY(6px); }
      50%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes chipPulse {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 1; }
    }
    @keyframes barGrow {
      0% { transform: scaleX(0); }
      30%, 100% { transform: scaleX(1); }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Background and border -->
    <rect width="700" height="250" rx="14" fill="url(#bg)"/>
    <rect x="1" y="1" width="698" height="248" rx="14" fill="none" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Scan bar -->
    <rect class="scanbar" x="0" y="0" width="700" height="60" fill="url(#scan)"/>

    <!-- Heading -->
    <g class="head" filter="url(#glow)">
      <text x="40" y="58" font-family="Orbitron, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">👋 Hi, I’m <tspan fill="#00E5FF">Sri Esakkiammal</tspan></text>
    </g>
    <rect class="wipe1" x="20" y="22" width="660" height="50" fill="#050A14"/>

    <line x1="40" y1="78" x2="660" y2="78" stroke="#00E5FF" stroke-opacity="0.4"/>

    <!-- Subtitle -->
    <g class="fadeUp" filter="url(#glow)">
      <text x="40" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#7FE7FF">Computer Vision Enthusiast | AI Learner | Future Roboticist</text>
    </g>

    <!-- Paragraph lines with wipe reveal -->
    <text x="40" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E6F7FF">I’m on a journey to explore how machines can see, understand, and interact</text>
    <rect class="wipe2" x="20" y="120" width="660" height="22" fill="#050A14"/>
    <text x="40" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E6F7FF">with the world. My focus is on Computer Vision, Machine Learning and</text>
    <rect class="wipe3" x="20" y="146" width="660" height="22" fill="#050A14" style="animation-delay:1.8s"/>
    <text x="40" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E6F7FF">Robotics.</text>

    <!-- Skill chips -->
    <g font-family="Consolas, Courier New, monospace" font-size="11" font-weight="700" letter-spacing="2">
      <rect class="chip" x="40" y="206" width="110" height="26" rx="4" fill="#0B1A2E" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="95" y="223" text-anchor="middle" fill="#7FE7FF">PYTHON</text>

      <rect class="chip c2" x="160" y="206" width="84" height="26" rx="4" fill="#0B1A2E" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="202" y="223" text-anchor="middle" fill="#7FE7FF">C++</text>

      <rect class="chip c3" x="254" y="206" width="90" height="26" rx="4" fill="#0B1A2E" stroke="#A78BFA" stroke-width="1.5"/>
      <text x="299" y="223" text-anchor="middle" fill="#C4B5FD">OPENCV</text>

      <rect class="chip c4" x="354" y="206" width="150" height="26" rx="4" fill="#0B1A2E" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="429" y="223" text-anchor="middle" fill="#7FE7FF">MACHINE LEARNING</text>

      <rect class="chip c5" x="40" y="238" width="0" height="0" rx="4"/>
    </g>
  </g>
</svg>
