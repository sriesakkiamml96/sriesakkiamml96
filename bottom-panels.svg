<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="cells" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#0F2233"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1728"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1"><rect x="20" y="20" width="280" height="220" rx="10"/></clipPath>
    <clipPath id="p2"><rect x="310" y="20" width="280" height="220" rx="10"/></clipPath>
    <clipPath id="p3"><rect x="600" y="20" width="280" height="220" rx="10"/></clipPath>
  </defs>

  <style>
    /* Background */
    .gridDrift { animation: gridDrift 20s linear infinite; }

    /* Panel borders: three different breathing rhythms */
    .breatheA { animation: breatheA 5s ease-in-out infinite; }
    .breatheB { animation: breatheB 6.5s ease-in-out infinite; }
    .breatheC { animation: breatheC 7.5s ease-in-out infinite; }

    /* Scan bars */
    .scanbar { animation: scanSweep 4s linear infinite; }
    .scanbar2 { animation: scanSweep 5.5s linear infinite; }
    .scanbar3 { animation: scanSweep 6.5s linear infinite; }

    /* Headings: each one enters differently */
    .headDrop { animation: headDrop 8s ease-out infinite; }
    .headRise { animation: headRise 9s ease-out infinite; }
    .headSlide { animation: headSlide 10s ease-out infinite; }

    /* Contribution cells */
    .cellPop { transform-box: fill-box; transform-origin: center; animation: cellPop 3s ease-in-out infinite; }
    .cellFade { animation: cellFade 4.2s ease-in-out infinite; }
    .cellFlip { transform-box: fill-box; transform-origin: center; animation: cellFlip 5s ease-in-out infinite; }

    /* Progress bar */
    .progress { transform-box: fill-box; transform-origin: left center; animation: progressFill 7s ease-in-out infinite; }

    /* Roadmap */
    .checkA { stroke-dasharray: 14; animation: checkDrawA 6s ease-in-out infinite; }
    .checkB { stroke-dasharray: 14; animation: checkDrawB 7.5s ease-in-out infinite; }
    .pendGlow { animation: pendGlow 3.2s ease-in-out infinite; }

    /* Connect panel */
    .chipIn { animation: chipIn 6s ease-out infinite; }
    .radar { transform-box: fill-box; transform-origin: center; animation: radar 2.6s ease-out infinite; }
    .dotBlink { animation: dotBlink 1.6s steps(2) infinite; }
    .wipe { transform-box: fill-box; animation: wipeOut 6s ease-in-out infinite; }

    /* Corners: draw-on, each on its own timing */
    .drawA { stroke-dasharray: 60; animation: drawCornerA 6s ease-in-out infinite; }
    .drawB { stroke-dasharray: 60; animation: drawCornerB 7s ease-in-out infinite; }
    .drawC { stroke-dasharray: 60; animation: drawCornerC 8s ease-in-out infinite; }

    /* Bottom rule spark */
    .ruleSpark { animation: ruleRun 3.6s linear infinite; }

    @keyframes gridDrift { from { transform: translate(0,0); } to { transform: translate(24px,24px); } }
    @keyframes breatheA { 0%,100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 0.7; } }
    @keyframes breatheB { 0%,100% { stroke-opacity: 0.2; } 40% { stroke-opacity: 0.8; } 70% { stroke-opacity: 0.4; } }
    @keyframes breatheC { 0%,100% { stroke-opacity: 0.5; } 60% { stroke-opacity: 1; } }
    @keyframes scanSweep { 0% { transform: translateY(-40px); } 100% { transform: translateY(280px); } }
    @keyframes headDrop {
      0% { opacity: 0; transform: translateY(-10px); }
      12% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes headRise {
      0% { opacity: 0; transform: translateY(10px); }
      15% { opacity: 1; transform: translateY(0); }
      88% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes headSlide {
      0% { opacity: 0; transform: translateX(-12px); }
      10% { opacity: 1; transform: translateX(0); }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes cellPop { 0%,100% { transform: scale(0.4); opacity: 0.3; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes cellFade { 0%,100% { opacity: 0.1; } 50% { opacity: 0.9; } }
    @keyframes cellFlip { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.2); } }
    @keyframes progressFill {
      0% { transform: scaleX(0); }
      60% { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }
    @keyframes checkDrawA { 0% { stroke-dashoffset: 14; } 30%,100% { stroke-dashoffset: 0; } }
    @keyframes checkDrawB { 0%,40% { stroke-dashoffset: 14; } 75%,100% { stroke-dashoffset: 0; } }
    @keyframes pendGlow { 0%,100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 1; } }
    @keyframes chipIn {
      0% { opacity: 0; transform: translateX(-14px); }
      12% { opacity: 1; transform: translateX(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes radar { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes dotBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes wipeOut { 0%,15% { transform: scaleX(1); transform-origin: left center; } 55%,100% { transform: scaleX(0); transform-origin: left center; } }
    @keyframes drawCornerA { 0% { stroke-dashoffset: 60; } 35% { stroke-dashoffset: 0; } 90%,100% { stroke-dashoffset: 0; } }
    @keyframes drawCornerB { 0% { stroke-dashoffset: 60; } 40% { stroke-dashoffset: 0; } 85%,100% { stroke-dashoffset: 0; } }
    @keyframes drawCornerC { 0% { stroke-dashoffset: 60; } 45% { stroke-dashoffset: 0; } 90%,100% { stroke-dashoffset: 0; } }
    @keyframes ruleRun { 0% { transform: translateX(0); } 100% { transform: translateX(780px); } }
  </style>

  <!-- Background -->
  <rect width="900" height="260" fill="#03060C"/>
  <rect class="gridDrift" x="-24" y="-24" width="948" height="308" fill="url(#grid)"/>

  <!-- ===== Panel 1: Contribution ===== -->
  <g clip-path="url(#p1)">
    <rect x="20" y="20" width="280" height="220" rx="10" fill="url(#panel)"/>
    <rect class="scanbar" x="20" y="0" width="280" height="60" fill="url(#scan)"/>
  </g>
  <rect class="breatheA" x="20" y="20" width="280" height="220" rx="10" fill="none" stroke="#00E5FF"/>
  <text class="headDrop" x="40" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="2">CONTRIBUTION <tspan fill="#00E5FF">MAP</tspan></text>
  <line x1="40" y1="62" x2="280" y2="62" stroke="#00E5FF" stroke-opacity="0.4"/>
  <rect x="40" y="78" width="240" height="112" rx="6" fill="url(#cells)"/>
  <g fill="#00E5FF">
    <rect class="cellPop" x="44" y="82" width="12" height="12" rx="2"/>
    <rect class="cellFade" x="92" y="98" width="12" height="12" rx="2"/>
    <rect class="cellFlip" x="140" y="114" width="12" height="12" rx="2"/>
    <rect class="cellPop" x="188" y="130" width="12" height="12" rx="2" style="animation-delay:1.1s"/>
    <rect class="cellFade" x="236" y="82" width="12" height="12" rx="2" style="animation-delay:0.6s"/>
    <rect class="cellFlip" x="60" y="146" width="12" height="12" rx="2" style="animation-delay:1.9s"/>
    <rect class="cellPop" x="108" y="162" width="12" height="12" rx="2" style="animation-delay:2.4s"/>
    <rect class="cellFade" x="212" y="162" width="12" height="12" rx="2" style="animation-delay:0.3s"/>
    <rect class="cellFlip" x="164" y="82" width="12" height="12" rx="2" style="animation-delay:1.6s"/>
  </g>
  <text x="40" y="216" font-family="Consolas, Courier New, monospace" font-size="11" fill="#7FE7FF" letter-spacing="1">LEARN • BUILD • INNOVATE</text>
  <text x="40" y="232" font-family="Consolas, Courier New, monospace" font-size="11" fill="#A78BFA" letter-spacing="1">AUTOMATE</text>

  <!-- ===== Panel 2: Roadmap ===== -->
  <g clip-path="url(#p2)">
    <rect x="310" y="20" width="280" height="220" rx="10" fill="url(#panel)"/>
    <rect class="scanbar2" x="310" y="0" width="280" height="60" fill="url(#scan)" style="animation-delay:1.3s"/>
  </g>
  <rect class="breatheB" x="310" y="20" width="280" height="220" rx="10" fill="none" stroke="#A78BFA"/>
  <text class="headRise" x="330" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="2">ROADMAP <tspan fill="#A78BFA">//</tspan></text>
  <line x1="330" y1="62" x2="570" y2="62" stroke="#A78BFA" stroke-opacity="0.4"/>
  <g font-family="Consolas, Courier New, monospace" font-size="12" fill="#E6F7FF">
    <rect x="330" y="78" width="14" height="14" rx="3" fill="#22C55E"/>
    <path class="checkA" d="M333 85 L336 88 L341 81" fill="none" stroke="#04110A" stroke-width="2"/>
    <text x="354" y="89">Strengthen Python Fundamentals</text>

    <rect x="330" y="100" width="14" height="14" rx="3" fill="#22C55E"/>
    <path class="checkB" d="M333 107 L336 110 L341 103" fill="none" stroke="#04110A" stroke-width="2"/>
    <text x="354" y="111">Learn Git &amp; GitHub</text>

    <rect class="pendGlow" x="330" y="122" width="14" height="14" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="354" y="133">Explore OpenCV</text>

    <rect class="pendGlow" x="330" y="144" width="14" height="14" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.8s"/>
    <text x="354" y="155">Build Real Projects</text>

    <rect class="pendGlow" x="330" y="166" width="14" height="14" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:1.6s"/>
    <text x="354" y="177">Explore Robotics &amp; ROS 2</text>

    <rect class="pendGlow" x="330" y="188" width="14" height="14" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:2.4s"/>
    <text x="354" y="199">Learn Deep Learning with PyTorch</text>
  </g>
  <text x="330" y="222" font-family="Consolas, Courier New, monospace" font-size="11" fill="#7FE7FF" letter-spacing="1">2 / 6 COMPLETE</text>
  <rect x="330" y="230" width="240" height="4" rx="2" fill="#1A2238"/>
  <rect class="progress" x="330" y="230" width="80" height="4" rx="2" fill="#A78BFA"/>

  <!-- ===== Panel 3: Connect ===== -->
  <g clip-path="url(#p3)">
    <rect x="600" y="20" width="280" height="220" rx="10" fill="url(#panel)"/>
    <rect class="scanbar3" x="600" y="0" width="280" height="60" fill="url(#scan)" style="animation-delay:2.6s"/>
  </g>
  <rect class="breatheC" x="600" y="20" width="280" height="220" rx="10" fill="none" stroke="#00E5FF"/>
  <text class="headSlide" x="620" y="50" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="2">CONNECT <tspan fill="#00E5FF">.SYS</tspan></text>
  <line x1="620" y1="62" x2="860" y2="62" stroke="#00E5FF" stroke-opacity="0.4"/>

  <g font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">
    <g class="chipIn">
      <rect x="620" y="80" width="110" height="28" rx="4" fill="#0B1A2E" stroke="#00E5FF" stroke-opacity="0.6"/>
      <text x="675" y="98" text-anchor="middle" fill="#7FE7FF">GITHUB</text>
    </g>
    <g class="chipIn" style="animation-delay:0.5s">
      <rect x="740" y="80" width="120" height="28" rx="4" fill="#0B1A2E" stroke="#00B4FF" stroke-opacity="0.6"/>
      <text x="800" y="98" text-anchor="middle" fill="#7FE7FF">LINKEDIN</text>
    </g>
    <g class="chipIn" style="animation-delay:1s">
      <rect x="620" y="118" width="110" height="28" rx="4" fill="#0B1A2E" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="675" y="136" text-anchor="middle" fill="#C4B5FD">EMAIL</text>
    </g>
    <g class="chipIn" style="animation-delay:1.5s">
      <rect x="740" y="118" width="120" height="28" rx="4" fill="#0B1A2E" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="800" y="136" text-anchor="middle" fill="#C4B5FD">X / TWITTER</text>
    </g>
  </g>

  <text x="620" y="180" font-family="Consolas, Courier New, monospace" font-size="11" fill="#6B7A99" letter-spacing="1">STATUS:</text>
  <circle class="radar" cx="680" cy="176" r="4" fill="none" stroke="#22C55E" stroke-width="1.2"/>
  <circle class="dotBlink" cx="680" cy="176" r="4" fill="#22C55E" filter="url(#glow)"/>
  <text x="692" y="180" font-family="Consolas, Courier New, monospace" font-size="11" fill="#22C55E" letter-spacing="1">OPEN TO COLLAB</text>

  <text x="620" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-style="italic" fill="#E6F7FF">Let’s build something amazing together!</text>
  <rect class="wipe" x="618" y="200" width="250" height="22" fill="#05080F"/>

  <!-- Corner brackets, each drawing on at its own speed -->
  <path class="drawA" d="M20 40 L20 20 L40 20" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawA" d="M280 20 L300 20 L300 40" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawB" d="M20 220 L20 240 L40 240" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawB" d="M280 240 L300 240 L300 220" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawB" d="M310 40 L310 20 L330 20" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path class="drawC" d="M570 20 L590 20 L590 40" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path class="drawC" d="M310 220 L310 240 L330 240" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path class="drawC" d="M570 240 L590 240 L590 220" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path class="drawA" d="M600 40 L600 20 L620 20" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawA" d="M860 20 L880 20 L880 40" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawB" d="M600 220 L600 240 L620 240" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path class="drawB" d="M860 240 L880 240 L880 220" fill="none" stroke="#00E5FF" stroke-width="2"/>

  <!-- Bottom rule with a traveling spark -->
  <rect x="20" y="250" width="860" height="2" fill="url(#rule)"/>
  <rect class="ruleSpark" x="20" y="249" width="120" height="4" fill="url(#spark)"/>
</svg>
